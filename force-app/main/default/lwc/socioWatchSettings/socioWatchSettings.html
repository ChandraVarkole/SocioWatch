<template>
  <main class="settings-page">
    <template if:true={isSaving}>
      <section
        class="save-progress-overlay"
        role="status"
        aria-live="assertive"
        aria-busy="true"
      >
        <div class="save-progress-card">
          <div class="save-progress-spinner">
            <lightning-spinner
              alternative-text={saveProgressAlternativeText}
              size="medium"
            ></lightning-spinner>
          </div>
          <h2>{saveProgressTitle}</h2>
          <p>{saveProgressMessage}</p>
          <template if:true={isVerifyingGoogleProfile}>
            <small>
              This may take up to 90 seconds. Keep this page open while we
              finish checking.
            </small>
          </template>
        </div>
      </section>
    </template>

    <template if:true={isLoading}>
      <div class="loading-state">
        <lightning-spinner
          alternative-text="Loading SocioWatch settings"
          size="medium"
        ></lightning-spinner>
      </div>
    </template>

    <template if:false={hasAccess}>
      <template if:false={isLoading}>
        <section class="access-error" role="alert">
          <lightning-icon
            icon-name="utility:lock"
            size="small"
            alternative-text="Access denied"
          ></lightning-icon>
          <div>
            <h2>Settings access required</h2>
            <p>{labels.accessDenied}</p>
          </div>
        </section>
      </template>
    </template>

    <template if:true={hasAccess}>
      <header class="settings-hero">
        <div class="hero-title">
          <img
            class="settings-logo"
            src={logoUrl}
            alt="SocioWatch — Mentions Converted to Intelligence"
          />
          <div>
            <p class="eyebrow">WORKSPACE SETUP</p>
            <h1>Settings</h1>
            <p>
              Control what SocioWatch monitors and keep your intelligence feed
              current.
            </p>
          </div>
        </div>
        <template if:true={hasSavedConfiguration}>
          <span class={monitoringBadgeClass}
            ><span class="status-dot"></span>{monitoringStatus}</span
          >
        </template>
      </header>

      <template if:true={showMetaAddOnBanner}>
        <section class="meta-addon-banner" aria-labelledby="meta-addon-title">
          <div>
            <p class="meta-addon-eyebrow">OPTIONAL PAID ADD-ON</p>
            <h2 id="meta-addon-title">Facebook &amp; Instagram Monitoring</h2>
            <p>
              Monitor selected business posts and comments in SocioWatch.
              Read-only access—SocioWatch never publishes, edits, hides,
              deletes, or replies to content.
            </p>
            <div class="meta-addon-tags">
              <span>Facebook Pages</span>
              <span>Instagram Professional</span>
            </div>
          </div>
          <a
            href="mailto:contact@getsociowatch.com?subject=SocioWatch%20Meta%20Monitoring%20Add-on"
          >
            Contact SocioWatch for paid add-on
          </a>
        </section>
      </template>

      <div class="settings-grid">
        <section class="form-panel">
          <div class="panel-heading">
            <div>
              <p class="section-number">01</p>
              <h2>Company profile</h2>
              <p>Tell us which brand and website this workspace represents.</p>
            </div>
          </div>
          <div class="profile-grid">
            <lightning-input
              data-field="companyName"
              type="text"
              name="companyName"
              label="Company Name (match Google Business Profile)"
              value={companyName}
              maxlength="255"
              required
              disabled={isSaving}
              onchange={handleCompanyNameChange}
            ></lightning-input>
            <lightning-input
              data-field="website"
              type="url"
              name="website"
              label="Company Website"
              value={website}
              maxlength="255"
              required
              disabled={isSaving}
              message-when-type-mismatch="Enter a valid website URL, including https://."
              onchange={handleWebsiteChange}
            ></lightning-input>
          </div>

          <div class="section-divider"></div>
          <div class="panel-heading">
            <div>
              <p class="section-number">02</p>
              <h2>Primary business location</h2>
              <p>
                This address location will be used as the primary location for
                Google reviews.
              </p>
            </div>
          </div>
          <div class="location-grid">
            <lightning-input
              data-field="companyCity"
              type="text"
              name="companyCity"
              label="City"
              value={companyCity}
              maxlength="100"
              required
              disabled={isSaving}
              autocomplete="address-level2"
              onchange={handleCompanyCityChange}
            ></lightning-input>
            <lightning-input
              data-field="companyStateProvince"
              type="text"
              name="companyStateProvince"
              label="State or Province"
              value={companyStateProvince}
              maxlength="100"
              required
              disabled={isSaving}
              autocomplete="address-level1"
              onchange={handleCompanyStateProvinceChange}
            ></lightning-input>
            <lightning-input
              data-field="companyCountry"
              type="text"
              name="companyCountry"
              label="Country"
              value={companyCountry}
              maxlength="100"
              required
              disabled={isSaving}
              autocomplete="country-name"
              onchange={handleCompanyCountryChange}
            ></lightning-input>
          </div>
          <template if:true={hasGoogleReviewsResolutionStatus}>
            <div
              class={googleReviewsStatusClass}
              role="status"
              aria-live="polite"
            >
              <template if:true={showInlineGoogleReviewsSpinner}>
                <div class="google-reviews-spinner">
                  <lightning-spinner
                    alternative-text="Verifying Google Business Profile"
                    size="small"
                  ></lightning-spinner>
                </div>
              </template>
              <span>{googleReviewsStatusText}</span>
            </div>
          </template>
          <div class="section-divider"></div>
          <div class="panel-heading">
            <div>
              <p class="section-number">03</p>
              <h2>LLM mentions</h2>
              <p>
                Choose the single company or brand keyword SocioWatch should
                track in AI-generated answers such as ChatGPT.
              </p>
            </div>
          </div>
          <div class="profile-grid">
            <lightning-input
              data-field="llmMentionKeyword"
              type="text"
              name="llmMentionKeyword"
              label="Keyword to track"
              value={llmMentionKeyword}
              maxlength="250"
              placeholder="Your company or brand name"
              required
              disabled={isSaving}
              onchange={handleLlmMentionKeywordChange}
            ></lightning-input>
          </div>
          <p class="field-help">
            We recommend using your company name. This keyword is matched
            against LLM-generated answers, not just the user's question.
          </p>

          <div class="section-divider"></div>
          <div class="panel-heading">
            <div>
              <p class="section-number">04</p>
              <h2>Automatic mention linking</h2>
              <p>
                Match each new mention's Author Name to a field on a Salesforce
                object and link the matching record.
              </p>
            </div>
          </div>
          <div class="review-control">
            <div>
              <h3>Link new mentions by author</h3>
              <p>
                A link is created only when one Salesforce record matches the
                author name exactly. Duplicate matches are left unlinked.
              </p>
            </div>
            <lightning-input
              type="toggle"
              name="autoLinkMentions"
              label="Link new mentions by author"
              variant="label-hidden"
              message-toggle-active="Enabled"
              message-toggle-inactive="Disabled"
              checked={autoLinkMentions}
              disabled={isSaving}
              onchange={handleAutoLinkMentionsChange}
            ></lightning-input>
          </div>
          <template if:true={autoLinkMentions}>
            <div class="profile-grid">
              <lightning-input
                data-field="authorMatchObjectApiName"
                type="text"
                name="authorMatchObjectApiName"
                label="Object API Name"
                value={authorMatchObjectApiName}
                maxlength="255"
                placeholder="Account"
                required
                disabled={isSaving}
                onchange={handleAuthorMatchObjectChange}
              ></lightning-input>
              <lightning-input
                data-field="authorMatchFieldApiName"
                type="text"
                name="authorMatchFieldApiName"
                label="Match Field API Name"
                value={authorMatchFieldApiName}
                maxlength="255"
                placeholder="Name"
                required
                disabled={isSaving}
                onchange={handleAuthorMatchFieldChange}
              ></lightning-input>
            </div>
            <p class="field-help">
              Example: use Account and Name to link an author named Acme to the
              Account whose Name is Acme.
            </p>
          </template>

          <div class="section-divider"></div>
          <div class="panel-heading keyword-heading">
            <div>
              <p class="section-number">05</p>
              <h2>Tracked keywords</h2>
              <p>
                Add brand names, products, services, or topics worth monitoring.
              </p>
            </div>
            <span class="keyword-count">{keywordCount} / 20</span>
          </div>
          <div class="keyword-manager">
            <template if:true={hasKeywords}>
              <div class="keyword-pills" aria-label="Tracked keywords">
                <template for:each={keywordItems} for:item="keyword">
                  <span class="keyword-pill" key={keyword.key}>
                    <span>{keyword.label}</span>
                    <button
                      type="button"
                      title="Remove keyword"
                      aria-label={keyword.removeLabel}
                      data-keyword={keyword.label}
                      disabled={isSaving}
                      onclick={handleRemoveKeyword}
                    >
                      <lightning-icon
                        icon-name="utility:close"
                        size="xx-small"
                        alternative-text=""
                      ></lightning-icon>
                    </button>
                  </span>
                </template>
              </div>
            </template>

            <template if:false={hasKeywords}>
              <div class="keyword-empty">
                <lightning-icon
                  icon-name="utility:search"
                  size="small"
                  alternative-text=""
                ></lightning-icon>
                <span>Add your first tracked keyword below.</span>
              </div>
            </template>

            <div class="keyword-add-row">
              <lightning-input
                class="keyword-input"
                data-field="keywords"
                type="text"
                name="keywordDraft"
                label="Add a tracked keyword"
                variant="label-hidden"
                value={keywordDraft}
                maxlength="100"
                placeholder="Type a keyword or phrase"
                disabled={isSaving}
                onchange={handleKeywordDraftChange}
                onkeydown={handleKeywordKeyDown}
              ></lightning-input>
              <lightning-button
                variant="brand-outline"
                label="Add keyword"
                icon-name="utility:add"
                disabled={isKeywordAddDisabled}
                onclick={handleAddKeyword}
              ></lightning-button>
            </div>

            <template if:true={hasKeywordSuggestions}>
              <div class="keyword-suggestions">
                <div class="suggestion-heading">
                  <span>
                    <lightning-icon
                      icon-name="utility:light_bulb"
                      size="xx-small"
                      alternative-text=""
                    ></lightning-icon>
                    Suggested for {companyName}
                  </span>
                  <small>Click to add</small>
                </div>

                <div class="suggestion-pills">
                  <template for:each={keywordSuggestions} for:item="suggestion">
                    <button
                      type="button"
                      key={suggestion.key}
                      data-keyword={suggestion.label}
                      disabled={suggestion.disabled}
                      onclick={handleAddSuggestion}
                    >
                      <lightning-icon
                        icon-name="utility:add"
                        size="xx-small"
                        alternative-text=""
                      ></lightning-icon>
                      {suggestion.label}
                    </button>
                  </template>
                </div>
              </div>
            </template>
          </div>
          <p class="field-help">
            Press Enter to add. Paste comma-separated keywords to add several at
            once.
          </p>

          <div class="section-divider"></div>
          <div class="monitor-control">
            <div>
              <p class="section-number">06</p>
              <h2>Monitoring</h2>
              <p>Keep background collection and synchronization enabled.</p>
            </div>
            <lightning-input
              type="toggle"
              name="syncEnabled"
              label="Enable Monitoring"
              variant="label-hidden"
              message-toggle-active="Active"
              message-toggle-inactive="Paused"
              checked={syncEnabled}
              disabled={isSaving}
              onchange={handleSyncEnabledChange}
            ></lightning-input>
          </div>

          <template if:true={showMetaConnectionControl}>
            <div class="section-divider"></div>
            <div class="panel-heading">
              <div>
                <p class="section-number">07</p>
                <h2>Facebook &amp; Instagram</h2>
                <p>
                  Connect business accounts for read-only monitoring. AWS
                  collects activity every three hours; Salesforce imports it
                  with the normal mentions sync.
                </p>
              </div>
            </div>
            <div class={metaControlClass}>
              <div>
                <h3>{metaControlStatusText}</h3>
                <p>
                  Meta handles login and consent. Salesforce never stores a Meta
                  password or access token.
                </p>
              </div>
              <lightning-button
                variant="brand-outline"
                label="Manage connection"
                icon-name="utility:link"
                disabled={isMetaLoading}
                onclick={handleOpenMetaModal}
              ></lightning-button>
            </div>
          </template>

          <div class="form-actions">
            <lightning-button
              variant="neutral"
              label={labels.syncNow}
              icon-name="utility:sync"
              disabled={isSyncDisabled}
              onclick={handleSync}
            ></lightning-button>
            <lightning-button
              variant="brand"
              label={labels.save}
              icon-name="utility:save"
              disabled={isSaveDisabled}
              onclick={handleSave}
            ></lightning-button>
          </div>
        </section>

        <aside class="status-panel">
          <div class="status-heading">
            <span class="pulse-icon"><span></span></span>
            <div>
              <p class="status-eyebrow">SYSTEM HEALTH</p>
              <h2>Connection status</h2>
            </div>
          </div>

          <template if:true={hasSavedConfiguration}>
            <dl class="summary-list">
              <div>
                <dt>Configuration</dt>
                <dd>{configurationNumber}</dd>
              </div>
              <div>
                <dt>Monitoring</dt>
                <dd>
                  <span class={monitoringBadgeClass}
                    ><span class="status-dot"></span>{monitoringStatus}</span
                  >
                </dd>
              </div>
              <div>
                <dt>Last sync</dt>
                <dd><span class={syncBadgeClass}>{lastSyncStatus}</span></dd>
              </div>
              <div>
                <dt>Last successful sync</dt>
                <dd>
                  <template if:true={lastSuccessfulSync}>
                    <lightning-formatted-date-time
                      value={lastSuccessfulSync}
                      year="numeric"
                      month="short"
                      day="2-digit"
                      hour="2-digit"
                      minute="2-digit"
                    ></lightning-formatted-date-time>
                  </template>
                  <template if:false={lastSuccessfulSync}
                    >Not available</template
                  >
                </dd>
              </div>
              <div class="company-id">
                <dt>SocioWatch Company ID</dt>
                <dd>{companyId}</dd>
              </div>
            </dl>
            <div class="status-note">
              <lightning-icon
                icon-name="utility:info"
                size="xx-small"
                alternative-text="Information"
              ></lightning-icon>
              <p>
                Sync Now requests an immediate collection. Mentions appear as
                they are processed and inserted.
              </p>
            </div>
          </template>

          <template if:false={hasSavedConfiguration}>
            <div class="not-configured">
              <lightning-icon
                icon-name="utility:setup"
                size="large"
                alternative-text=""
              ></lightning-icon>
              <h3>Ready to connect</h3>
              <p>Complete the form and save to create this workspace.</p>
            </div>
          </template>
        </aside>
      </div>

      <template if:true={isMetaModalOpen}>
        <section
          class="slds-modal slds-fade-in-open meta-modal"
          role="dialog"
          aria-modal="true"
          aria-labelledby="meta-modal-title"
        >
          <div class="slds-modal__container">
            <header class="slds-modal__header meta-modal-header">
              <button
                class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                title="Close"
                disabled={isMetaLoading}
                onclick={handleCloseMetaModal}
              >
                <lightning-icon
                  icon-name="utility:close"
                  alternative-text="Close"
                  size="small"
                  variant="inverse"
                ></lightning-icon>
              </button>
              <p class="meta-modal-eyebrow">READ-ONLY MONITORING</p>
              <h2 id="meta-modal-title">Facebook &amp; Instagram</h2>
              <p>
                Connect accounts you are authorized to manage. SocioWatch reads
                selected posts and comments and saves their source links.
              </p>
            </header>

            <div class="slds-modal__content meta-modal-content">
              <template if:true={isMetaLoading}>
                <div class="meta-loading">
                  <lightning-spinner
                    alternative-text="Updating Meta connection"
                    size="medium"
                  ></lightning-spinner>
                </div>
              </template>

              <template if:true={showMetaPrerequisites}>
                <section class="meta-modal-section">
                  <span class="meta-step">01</span>
                  <h3>Choose what to monitor</h3>
                  <lightning-radio-group
                    name="metaMonitoringMode"
                    label="Monitoring option"
                    options={metaModeOptions}
                    value={metaMonitoringMode}
                    type="radio"
                    disabled={isMetaLoading}
                    onchange={handleMetaModeChange}
                  ></lightning-radio-group>
                </section>

                <section class="meta-modal-section">
                  <span class="meta-step">02</span>
                  <h3>Confirm the prerequisites</h3>
                  <p class="meta-help">
                    Facebook is required. Instagram monitoring is available when
                    a Professional account is linked to the Facebook Page.
                  </p>
                  <lightning-input
                    type="checkbox"
                    name="confirmsFacebookPage"
                    label="My business has a Facebook Page, not only a personal profile."
                    checked={confirmsFacebookPage}
                    disabled={isMetaLoading}
                    onchange={handleMetaConfirmationChange}
                  ></lightning-input>
                  <lightning-input
                    type="checkbox"
                    name="confirmsFacebookControl"
                    label="I have administrator or full-control access to that Page."
                    checked={confirmsFacebookControl}
                    disabled={isMetaLoading}
                    onchange={handleMetaConfirmationChange}
                  ></lightning-input>
                  <template if:true={isFacebookAndInstagramMode}>
                    <lightning-input
                      type="checkbox"
                      name="confirmsInstagramProfessional"
                      label="My Instagram account is a Business or Creator account."
                      checked={confirmsInstagramProfessional}
                      disabled={isMetaLoading}
                      onchange={handleMetaConfirmationChange}
                    ></lightning-input>
                    <lightning-input
                      type="checkbox"
                      name="confirmsInstagramLinked"
                      label="The Instagram account is connected to the Facebook Page."
                      checked={confirmsInstagramLinked}
                      disabled={isMetaLoading}
                      onchange={handleMetaConfirmationChange}
                    ></lightning-input>
                  </template>
                  <lightning-input
                    type="checkbox"
                    name="confirmsAccountAuthority"
                    label="I am authorized to connect these business accounts."
                    checked={confirmsAccountAuthority}
                    disabled={isMetaLoading}
                    onchange={handleMetaConfirmationChange}
                  ></lightning-input>
                  <div class="meta-consent">
                    <lightning-input
                      type="checkbox"
                      name="confirmsReadOnlyAccess"
                      label="I authorize SocioWatch to read posts, comments, and related engagement from the business accounts I select."
                      checked={confirmsReadOnlyAccess}
                      disabled={isMetaLoading}
                      onchange={handleMetaConfirmationChange}
                    ></lightning-input>
                    <p>
                      SocioWatch will not create, edit, delete, hide, publish,
                      or respond to content.
                    </p>
                  </div>
                </section>
              </template>

              <template if:true={isMetaPendingSelection}>
                <section class="meta-modal-section">
                  <span class="meta-step">03</span>
                  <h3>Select the accounts to monitor</h3>
                  <p class="meta-help">
                    Choose one or more Facebook Pages returned by Meta. Linked
                    Instagram accounts are shown beside their Page.
                  </p>
                  <lightning-checkbox-group
                    name="metaPages"
                    label="Eligible business accounts"
                    options={metaPageOptions}
                    value={metaSelectedPageIds}
                    disabled={isMetaLoading}
                    onchange={handleMetaPageSelection}
                  ></lightning-checkbox-group>
                </section>
              </template>

              <template if:true={isMetaConnected}>
                <section class="meta-modal-section meta-connected-summary">
                  <div class="meta-connected-heading">
                    <lightning-icon
                      icon-name="utility:success"
                      alternative-text="Connected"
                      size="small"
                    ></lightning-icon>
                    <div>
                      <h3>{metaConnectionLabel}</h3>
                      <p>Automatic collection runs every three hours.</p>
                    </div>
                  </div>
                  <h4>Facebook Pages</h4>
                  <ul>
                    <template for:each={connectedFacebookPages} for:item="page">
                      <li key={page.pageId}>{page.pageName}</li>
                    </template>
                  </ul>
                  <template if:true={hasConnectedInstagramAccounts}>
                    <h4>Instagram Professional accounts</h4>
                    <ul>
                      <template
                        for:each={connectedInstagramAccounts}
                        for:item="account"
                      >
                        <li key={account.accountId}>@{account.username}</li>
                      </template>
                    </ul>
                  </template>
                </section>
              </template>
            </div>

            <footer class="slds-modal__footer meta-modal-footer">
              <template if:true={showMetaPrerequisites}>
                <lightning-button
                  variant="brand"
                  label="Connect with Meta"
                  icon-name="utility:new_window"
                  disabled={isMetaConnectDisabled}
                  onclick={handleStartMetaConnection}
                ></lightning-button>
              </template>
              <template if:true={isMetaPendingSelection}>
                <lightning-button
                  variant="neutral"
                  label="Refresh"
                  disabled={isMetaLoading}
                  onclick={refreshMetaConnection}
                ></lightning-button>
                <lightning-button
                  variant="brand"
                  label="Start monitoring selected accounts"
                  disabled={isMetaSelectionDisabled}
                  onclick={handleSaveMetaSelection}
                ></lightning-button>
              </template>
              <template if:true={isMetaConnected}>
                <lightning-button
                  variant="destructive-text"
                  label="Disconnect"
                  disabled={isMetaLoading}
                  onclick={handleDisconnectMeta}
                ></lightning-button>
                <lightning-button
                  variant="brand-outline"
                  label="Reconnect or change accounts"
                  disabled={isMetaLoading}
                  onclick={handlePrepareMetaReconnect}
                ></lightning-button>
              </template>
            </footer>
          </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
      </template>
    </template>
  </main>
</template>
